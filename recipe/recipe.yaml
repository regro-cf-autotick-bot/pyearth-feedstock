context:
  name: pyearth
  version: "0.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/changliao1025/pyearth/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d8136c35b650fd8109c3af47c3e818d8e5a9489b0ef3ba25f5343d3ca96729c7

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed
  skip:
    - win and vc<14

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - cython >=0.29.0
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - pip
    - python
    - setuptools
    - numpy
    - cython >=0.29.0
  run:
    - python
    - ${{ pin_compatible('numpy') }}
    - gdal
    - netcdf4
    - pandas
    - scipy
    - rtree
    - geographiclib
    - statsmodels

tests:
  - python:
      imports:
        - pyearth
        - pyearth.gis.geometry.kernel
        - pyearth.gis.location.kernel
      pip_check: true

about:
  homepage: https://github.com/changliao1025/pyearth
  summary: Python for Earth Science.
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - changliao1025
  feedstock-name: ${{ name|lower }}
